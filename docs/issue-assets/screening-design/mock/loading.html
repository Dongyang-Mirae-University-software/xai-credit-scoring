<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"><style>
.main{display:flex;justify-content:center;align-items:flex-start}
.ld{width:600px;background:#FFF;border-radius:24px;padding:40px 48px 36px;margin-top:8px}
.ld h1{text-align:center;font-size:26px;line-height:1.45;margin:0 0 6px}
.ld .sub{text-align:center;margin-bottom:28px}
.grp{font-size:12px;font-weight:700;color:var(--ink3);margin:18px 0 8px}
.row{display:flex;align-items:center;gap:14px;height:56px}
.lg i{font-size:22px}.lg{width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#FFF;letter-spacing:-.02em;position:relative}
.kcb{background:#1B3A6B}.nice{background:#D7263D}.tel{background:#7F77DD}.hlt{background:#FFF;box-shadow:inset 0 0 0 1.5px var(--line)}.card{background:#EF9F27}.bank{background:var(--accent)}
.row .tx{flex:1;font-size:15px;color:var(--ink2)}.row .tx small{display:block;font-size:12px;color:var(--ink3)}
.st{font-size:13px;font-weight:700;color:var(--ink3);width:70px;text-align:right}
.row.done .st{color:var(--ok)}.row.doing .st{color:var(--accent)}
.row.todo .lg{filter:grayscale(1);opacity:.35}.row.todo .tx{color:var(--ink3)}
.row.doing .lg{animation:flip 1.1s ease-in-out infinite}
.row.doing .lg::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--accentbg);border-top-color:var(--accent);animation:spin .8s linear infinite}
.row.done .lg::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--ok);border:2px solid #FFF;font-size:10px;display:flex;align-items:center;justify-content:center}
@keyframes flip{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:3px;background:var(--fill);margin-top:24px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
</style></head><body>
<div class="hd"><div class="logo"><i></i><div><b>대안신용평가 심사 시스템</b><small>XAI 기반 씬파일러 대출 심사</small></div></div><div class="hr"><span class="pill">교육용</span><span class="acc"></span></div></div>
<div class="wrap"><div class="sb"><h6>심사 업무</h6><a class="on">고객 심사</a><a>XAI 분석</a><h6 style="margin-top:14px">모델 검증</h6><a>공정성</a><a>모델 성능</a><a>통계 검증</a></div>
<div class="main"><div class="ld">
<h1>이준호님의 정보를<br>가져오고 있어요</h1><p class="sub">고객님이 동의한 기관에서만 받아 와요</p>
<div class="grp">신용정보 · CB사</div>
<div class="row" data-i="0"><div class="lg kcb"><i class="ti ti-shield-check"></i></div><div class="tx">KCB (코리아크레딧뷰로)<small>대출 · 카드 · 연체 기록</small></div><span class="st"></span></div>
<div class="row" data-i="1"><div class="lg nice"><i class="ti ti-chart-arrows-vertical"></i></div><div class="tx">NICE평가정보<small>대출 · 카드 · 연체 기록</small></div><span class="st"></span></div>
<div class="grp">대안정보 · 마이데이터</div>
<div class="row" data-i="2"><div class="lg tel"><i class="ti ti-device-mobile"></i></div><div class="tx">통신사<small>통신요금 납부 기록</small></div><span class="st"></span></div>
<div class="row" data-i="3"><div class="lg hlt"><img src="nhis_symbol.svg" alt="국민건강보험공단" style="width:28px;height:28px;object-fit:contain"></div><div class="tx">국민건강보험공단<small>건강보험료 납부 기록</small></div><span class="st"></span></div>
<div class="row" data-i="4"><div class="lg card"><i class="ti ti-credit-card"></i></div><div class="tx">카드사 · 은행<small>소비 · 정기결제 내역</small></div><span class="st"></span></div>
<div class="row" data-i="5"><div class="lg bank"><i class="ti ti-building-bank"></i></div><div class="tx">남궁 은행<small>앱 로그인 기록</small></div><span class="st"></span></div>
<div class="bar"><i id="bar"></i></div>
</div></div></div>
<script>
const rows=[...document.querySelectorAll('.row')];
const q=new URLSearchParams(location.search); const fixed=q.get('step');
function show(n){rows.forEach((r,i)=>{r.className='row '+(i<n?'done':i===n?'doing':'todo');r.querySelector('.st').textContent=i<n?'받음':i===n?'가져오는 중':'대기'});document.getElementById('bar').style.width=(n/rows.length*100)+'%'}
if(fixed!==null){show(+fixed)}else{let n=0;show(0);setInterval(()=>{n=(n+1)%(rows.length+1);show(n)},1400)}
</script>
</body></html>
