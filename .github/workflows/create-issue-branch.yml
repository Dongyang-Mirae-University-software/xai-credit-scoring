# 작업 이슈가 등록되면 규칙에 맞는 브랜치를 자동으로 만들고 이슈에 안내 댓글을 단다.
# 브랜치 이름: <type>/<이슈번호>-<설명>  예) feature/12-alt-data-simulator
name: 이슈 브랜치 자동 생성

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const TYPES = ['feature', 'fix', 'hotfix', 'refactor', 'design', 'docs', 'test', 'chore', 'infra'];
            const issue = context.payload.issue;
            const body = issue.body || '';

            // 이슈 양식은 "### 라벨\n\n값" 형태로 본문에 저장된다
            const field = (label) => {
              const m = body.match(new RegExp(`###\\s*${label}\\s*\\n+([^\\n]+)`));
              return m ? m[1].trim() : '';
            };

            const type = field('작업 종류').split(/\s/)[0];
            const desc = field('브랜치 설명');

            // 작업 양식으로 만든 이슈가 아니면 건너뛴다
            if (!type && !desc) return;

            const comment = (text) => github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number, body: text,
            });

            if (!TYPES.includes(type) || !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(desc) || desc.length > 40) {
              await comment([
                '⚠️ 브랜치를 자동으로 만들지 못했습니다.',
                '',
                `- 작업 종류: \`${type || '(없음)'}\``,
                `- 브랜치 설명: \`${desc || '(없음)'}\``,
                '',
                '브랜치 설명은 **영문 소문자**, 띄어쓰기 없이 단어를 **하이픈(-)** 으로 구분하고 40자 이내로 써주세요. (예: `alt-data-simulator`)',
                '이슈를 닫고 다시 등록하거나, 직접 브랜치를 만들어주세요.',
              ].join('\n'));
              return;
            }

            const branch = `${type}/${issue.number}-${desc}`;
            const base = type === 'hotfix' ? 'main' : 'develop';

            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${base}` });
            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${branch}`, sha: ref.object.sha });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = 이미 있는 브랜치
            }

            await comment([
              `🌱 \`${base}\`에서 브랜치 **\`${branch}\`** 를 만들었습니다.`,
              '',
              '```bash',
              'git fetch origin',
              `git switch ${branch}`,
              '```',
              '',
              `PR 본문에 \`Closes #${issue.number}\` 을 적으면 develop에 머지될 때 이 이슈가 자동으로 닫힙니다.`,
            ].join('\n'));
