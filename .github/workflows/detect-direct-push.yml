# develop·main 에 PR 을 거치지 않은 커밋이 push 되면 경고 이슈를 올린다.
# 무료 조직의 비공개 레포라 브랜치 보호 규칙이 강제되지 않아, 막는 대신 기록을 남긴다.
name: 직접 push 감지

on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { commits = [], pusher, ref, compare } = context.payload;
            const branch = ref.replace('refs/heads/', '');
            if (!commits.length) return;

            // 머지 직후에는 커밋-PR 연결 정보가 늦게 잡힐 수 있어 몇 번 다시 확인한다
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const fromMergedPr = async (sha) => {
              for (let i = 0; i < 4; i++) {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  ...context.repo, commit_sha: sha,
                });
                if (data.some(pr => pr.merged_at)) return true;
                await sleep(10000);
              }
              return false;
            };

            const direct = [];
            for (const c of commits) {
              if (!(await fromMergedPr(c.id))) direct.push(c);
            }
            if (!direct.length) {
              core.info('모든 커밋이 PR 을 통해 들어왔습니다.');
              return;
            }

            const lines = direct.map(c =>
              `- [\`${c.id.slice(0, 7)}\`](${c.url}) ${c.message.split('\n')[0]} — ${c.author.name}`);

            await github.rest.issues.create({
              ...context.repo,
              title: `⚠️ ${branch} 에 PR 없이 직접 push 됨 (${pusher.name})`,
              body: [
                `@${pusher.name} 님이 \`${branch}\` 에 PR 을 거치지 않은 커밋을 push 했습니다.`,
                '',
                ...lines,
                '',
                `변경 내용: ${compare}`,
                '',
                '팀 규칙 3번: `main`·`develop` 에는 직접 올리지 않고 무조건 PR 을 거칩니다.',
                '이미 들어간 커밋은 되돌리지 않아도 됩니다. 담당 리뷰어가 내용을 확인한 뒤 이 이슈를 닫아주세요.',
              ].join('\n'),
            });
            core.warning(`PR 을 거치지 않은 커밋 ${direct.length}개를 감지해 이슈를 올렸습니다.`);
