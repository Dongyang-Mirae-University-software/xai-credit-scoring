name: 작업
description: 할 일을 등록하면 규칙에 맞는 브랜치가 자동으로 만들어집니다
title: "[작업] "
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 종류
      options:
        - feature — 기능 개발
        - fix — 버그 수정
        - hotfix — 운영 긴급 수정 (main에서 분기)
        - refactor — 리팩토링
        - design — UI/디자인 작업
        - docs — 문서 작업
        - test — 테스트 코드
        - chore — 설정, 패키지, 잡일
        - infra — 서버, Docker, CI/CD
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: 브랜치 설명
      description: 영문 소문자, 띄어쓰기 없이 단어는 하이픈(-)으로 구분. 기능 단위가 보이게 짧게.
      placeholder: alt-data-simulator
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇을, 왜
      description: 어떻게 보다 무엇을, 왜 하는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 끝난 것인지 적어주세요.
      placeholder: "- [ ] 대안 변수 5개 생성\n- [ ] 타겟과의 상관계수 0.3~0.5 확인"
