# MLflow 트래킹 서버 — 단독 배포용. 사용법은 README.md
#   cp .env.example .env && docker compose up -d
# 호스트 포트는 127.0.0.1 에만 묶는다. 외부 노출은 nginx(basic auth) 로만 한다 — MLflow 자체에는 인증이 없다.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0   # 클라이언트(requirements 의 mlflow)와 메이저·마이너를 맞출 것
    container_name: ${MLFLOW_CONTAINER_NAME:-xai-mlflow}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --serve-artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlruns:/mlflow   # 실험 DB + 아티팩트 전부. 백업 대상은 이 폴더 하나
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
